name: Publish guide and desktop package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the pinned Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - name: Generate the application mark and build provenance
        run: |
          node scripts/generate-app-icon.mjs
          node scripts/write-build-provenance.mjs
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload the static guide
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  desktop-package:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the pinned Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the Squirrel.Windows package
        run: npm run make
      - name: Preserve package output even when an earlier step fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roco-kingdom-world-guide-desktop-${{ github.sha }}
          path: out/make/squirrel.windows/x64/
          if-no-files-found: warn
          retention-days: 30
